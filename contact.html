<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="docTitle">اتصل بنا | PostTime Atlas</title>
    <meta id="docDesc" name="description" content="تواصل مع فريق PostTime Atlas للاستفسارات والاقترحات أو الدعم الفني.">
    
    <!-- SEO & Canonical -->
    <link rel="canonical" href="https://posttimeatlas.com/contact.html" id="canonicalUrl">
    <link rel="alternate" hreflang="ar" href="https://posttimeatlas.com/contact.html" />
    <link rel="alternate" hreflang="en" href="https://posttimeatlas.com/contact.html?lang=en" />
    <link rel="alternate" hreflang="x-default" href="https://posttimeatlas.com/contact.html" />

    <!-- Script to check saved language, URL param, or browser language before rendering to prevent UI flash -->
    <script>
        (function() {
            var urlParams = new URLSearchParams(window.location.search);
            var langParam = urlParams.get('lang');
            var savedLang = langParam || localStorage.getItem('siteLang');
            
            if (!savedLang) {
                var userLang = navigator.language || navigator.userLanguage;
                savedLang = userLang.startsWith('ar') ? 'ar' : 'en';
            }
            
            if (langParam) {
                localStorage.setItem('siteLang', langParam);
            }

            document.documentElement.lang = savedLang;
            document.documentElement.dir = savedLang === 'ar' ? 'rtl' : 'ltr';
            window.__initialLang = savedLang;
        })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', 'Inter', sans-serif; }</style>
</head>
<body id="bodyTag" class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between antialiased">

    <!-- Header -->
    <header class="border-b border-slate-200 p-4 bg-white/90 backdrop-blur sticky top-0 z-40 shadow-sm">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="index.html" id="logoLink" class="flex items-center gap-2.5">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="#4f46e5" stroke-width="2.2"/>
                    <path d="M12 6V12L16 14" stroke="#4f46e5" stroke-width="2.2" stroke-linecap="round"/>
                    <circle cx="12" cy="12" r="2" fill="#4f46e5"/>
                </svg>
                <span class="text-xl font-black text-slate-900 tracking-tight">PostTime<span class="text-indigo-600">Atlas</span></span>
            </a>
            
            <div class="flex items-center gap-3">
                <button onclick="toggleLanguage()" id="langBtn" class="bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700 text-xs px-3 py-1.5 rounded-lg font-bold transition">
                    English 🌐
                </button>
                <a href="index.html" id="btnBack" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-3 py-1.5 rounded-lg font-bold transition">
                    الرئيسية 🚀
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-3xl mx-auto w-full px-4 my-8 flex-grow">
        <article class="bg-white border border-slate-200 rounded-2xl p-6 md:p-10 shadow-sm space-y-6">
            
            <header class="border-b border-slate-100 pb-6">
                <h1 id="pageTitle" class="text-2xl md:text-3xl font-extrabold text-slate-900 leading-tight">
                    اتصل بنا
                </h1>
                <p id="pageMeta" class="text-xs text-slate-400 mt-2">تاريخ التحديث: 2026</p>
            </header>

            <div id="pageBody" class="prose prose-slate max-w-none text-sm leading-relaxed text-slate-700 space-y-4">
                <!-- المحتوى عبر السكربت -->
            </div>

        </article>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 py-6 text-center text-xs text-slate-500 bg-white">
        <div class="max-w-4xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <p id="footerText">© 2026 PostTime Atlas. جميع الحقوق محفوظة.</p>
            <div class="flex items-center gap-4 font-semibold text-slate-600">
                <a href="privacy.html" id="btnPrivacy" class="hover:underline hover:text-indigo-600 transition">سياسة الخصوصية</a>
                <a href="terms.html" id="btnTerms" class="hover:underline hover:text-indigo-600 transition">شروط الخدمة</a>
                <a href="contact.html" id="btnContact" class="hover:underline hover:text-indigo-600 transition">اتصل بنا</a>
            </div>
        </div>
    </footer>

    <script>
        function getInitialLanguage() {
            if (window.__initialLang) return window.__initialLang;
            var urlParams = new URLSearchParams(window.location.search);
            var urlLang = urlParams.get('lang');
            var savedLang = localStorage.getItem('siteLang');
            var systemLang = (navigator.language || navigator.userLanguage || 'ar').toLowerCase();
            var lang = urlLang || savedLang || (systemLang.startsWith('ar') ? 'ar' : 'en');
            localStorage.setItem('siteLang', lang);
            return lang;
        }

        let currentLang = getInitialLanguage();

        const content = {
            ar: {
                docTitle: 'اتصل بنا | PostTime Atlas',
                docDesc: 'تواصل مع فريق PostTime Atlas للاستفسارات والاقترحات أو الدعم الفني.',
                btnBack: 'الرئيسية 🚀',
                pageTitle: 'اتصل بنا (Contact Us)',
                pageMeta: 'تاريخ التحديث: 2026',
                footerText: '© 2026 PostTime Atlas. جميع الحقوق محفوظة.',
                btnPrivacy: 'سياسة الخصوصية',
                btnTerms: 'شروط الخدمة',
                btnContact: 'اتصل بنا',
                body: `
                    <p>يسعدنا دائماً التواصل معك! إذا كان لديك أي استفسار، اقتراح لتطوير الأدوات، أو ترغب في الإبلاغ عن مشكلة فنية، لا تتردد في المراسلة.</p>

                    <h2 class="text-base font-bold text-slate-900 pt-2">البريد الإلكتروني المباشر</h2>
                    <p>يمكنك التواصل معنا مباشرة عبر البريد الإلكتروني التالي:</p>
                    <div class="bg-indigo-50/50 border border-indigo-100 p-3 rounded-xl font-mono text-center font-bold">
                        <a href="mailto:halfabrain24@gmail.com" class="text-indigo-600 hover:underline">halfabrain24@gmail.com</a>
                    </div>

                    <h2 class="text-base font-bold text-slate-900 pt-2">نموذج التواصل السريع</h2>
                    <form onsubmit="event.preventDefault(); alert('شكرًا لتواصلك معنا! سنرد عليك في أقرب وقت.');" class="space-y-4 pt-2">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">الاسم الكامل</label>
                            <input type="text" required placeholder="أدخل اسمك" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-indigo-500 bg-slate-50/50">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">البريد الإلكتروني</label>
                            <input type="email" required placeholder="name@example.com" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-indigo-500 bg-slate-50/50">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">الرسالة</label>
                            <textarea rows="4" required placeholder="اكتب رسالتك هنا..." class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-indigo-500 bg-slate-50/50"></textarea>
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm py-2.5 rounded-lg transition">إرسال الرسالة 📤</button>
                    </form>
                `
            },
            en: {
                docTitle: 'Contact Us | PostTime Atlas',
                docDesc: 'Get in touch with the PostTime Atlas team for feedback, inquiries, or technical support.',
                btnBack: 'Home 🚀',
                pageTitle: 'Contact Us',
                pageMeta: 'Updated: 2026',
                footerText: '© 2026 PostTime Atlas. All rights reserved.',
                btnPrivacy: 'Privacy Policy',
                btnTerms: 'Terms of Service',
                btnContact: 'Contact Us',
                body: `
                    <p>We’d love to hear from you! Whether you have questions, feedback, or need support with our tools, please feel free to reach out.</p>

                    <h2 class="text-base font-bold text-slate-900 pt-2">Direct Email</h2>
                    <p>You can contact our support team directly via email:</p>
                    <div class="bg-indigo-50/50 border border-indigo-100 p-3 rounded-xl font-mono text-center font-bold">
                        <a href="mailto:halfabrain24@gmail.com" class="text-indigo-600 hover:underline">halfabrain24@gmail.com</a>
                    </div>

                    <h2 class="text-base font-bold text-slate-900 pt-2">Quick Contact Form</h2>
                    <form onsubmit="event.preventDefault(); alert('Thank you for reaching out! We will reply soon.');" class="space-y-4 pt-2">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Full Name</label>
                            <input type="text" required placeholder="Enter your name" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-indigo-500 bg-slate-50/50">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Email Address</label>
                            <input type="email" required placeholder="name@example.com" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-indigo-500 bg-slate-50/50">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Message</label>
                            <textarea rows="4" required placeholder="Write your message..." class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-indigo-500 bg-slate-50/50"></textarea>
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm py-2.5 rounded-lg transition">Send Message 📤</button>
                    </form>
                `
            }
        };

        function renderLanguage() {
            const data = content[currentLang];
            const dir = currentLang === 'ar' ? 'rtl' : 'ltr';

            document.documentElement.lang = currentLang;
            document.documentElement.dir = dir;
            document.getElementById('htmlTag').dir = dir;
            document.getElementById('bodyTag').dir = dir;

            document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'English 🌐' : 'العربية 🌐';
            document.getElementById('docTitle').innerText = data.docTitle;
            document.getElementById('docDesc').setAttribute('content', data.docDesc);
            
            // تحديث الروابط للحفاظ على اللغة
            document.getElementById('logoLink').href = `index.html?lang=${currentLang}`;
            document.getElementById('btnBack').innerText = data.btnBack;
            document.getElementById('btnBack').href = `index.html?lang=${currentLang}`;
            
            document.getElementById('pageTitle').innerText = data.pageTitle;
            document.getElementById('pageMeta').innerText = data.pageMeta;
            document.getElementById('footerText').innerText = data.footerText;

            document.getElementById('btnPrivacy').innerText = data.btnPrivacy;
            document.getElementById('btnPrivacy').href = `privacy.html?lang=${currentLang}`;
            
            document.getElementById('btnTerms').innerText = data.btnTerms;
            document.getElementById('btnTerms').href = `terms.html?lang=${currentLang}`;
            
            document.getElementById('btnContact').innerText = data.btnContact;
            document.getElementById('btnContact').href = `contact.html?lang=${currentLang}`;

            const pageBody = document.getElementById('pageBody');
            pageBody.innerHTML = data.body;
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            localStorage.setItem('siteLang', currentLang);
            
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('lang', currentLang);
            window.history.pushState({}, '', newUrl);

            renderLanguage();
        }

        window.addEventListener('DOMContentLoaded', renderLanguage);
    </script>
</body>
</html>
