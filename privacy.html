<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="docTitle">سياسة الخصوصية | PostTime Atlas</title>
    <meta id="docDesc" name="description" content="سياسة الخصوصية لموقع PostTime Atlas وتوضيح كيفية التعامل مع البيانات وملفات تعريف الارتباط.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between antialiased">

    <!-- Header -->
    <header class="border-b border-slate-200 p-4 bg-white/90 backdrop-blur sticky top-0 z-40 shadow-sm">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2.5">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="#4f46e5" stroke-width="2.2"/>
                    <path d="M12 6V12L16 14" stroke="#4f46e5" stroke-width="2.2" stroke-linecap="round"/>
                    <circle cx="12" cy="12" r="2" fill="#4f46e5"/>
                </svg>
                <span class="text-xl font-black text-slate-900 tracking-tight">PostTime<span class="text-indigo-600">Atlas</span></span>
            </a>
            
            <div class="flex items-center gap-3">
                <button onclick="toggleLanguage()" id="langBtn" class="bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700 text-xs px-3 py-1.5 rounded-lg font-bold transition">
                    English 🌐
                </button>
                <a href="index.html" id="btnBack" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-3 py-1.5 rounded-lg font-bold transition">
                    الرئيسية 🚀
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-3xl mx-auto w-full px-4 my-8 flex-grow">
        <article class="bg-white border border-slate-200 rounded-2xl p-6 md:p-10 shadow-sm space-y-6">
            
            <header class="border-b border-slate-100 pb-6">
                <h1 id="pageTitle" class="text-2xl md:text-3xl font-extrabold text-slate-900 leading-tight">
                    سياسة الخصوصية
                </h1>
                <p id="pageMeta" class="text-xs text-slate-400 mt-2">تاريخ التحديث: 2026</p>
            </header>

            <div id="pageBody" class="prose prose-slate max-w-none text-sm leading-relaxed text-slate-700 space-y-4">
                <!-- المحتوى عبر السكربت -->
            </div>

        </article>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 py-6 text-center text-xs text-slate-500 bg-white">
        <p id="footerText">© 2026 PostTime Atlas. جميع الحقوق محفوظة.</p>
    </footer>

    <script>
        let currentLang = 'ar';

        const content = {
            ar: {
                docTitle: 'سياسة الخصوصية | PostTime Atlas',
                docDesc: 'سياسة الخصوصية لموقع PostTime Atlas وتوضيح كيفية التعامل مع البيانات وملفات تعريف الارتباط.',
                btnBack: 'الرئيسية 🚀',
                pageTitle: 'سياسة الخصوصية (Privacy Policy)',
                pageMeta: 'تاريخ التحديث: 2026',
                footerText: '© 2026 PostTime Atlas. جميع الحقوق محفوظة.',
                body: `
                    <p>في <strong>PostTime Atlas</strong>، نولي أهمية بالغة لخصوصية زوارنا. توضح هذه الوثيقة أنواع المعلومات الشخصية التي يتم جمعها وكيفية استخدامها.</p>
                    
                    <h2 class="text-base font-bold text-slate-900 pt-2">1. جمع البيانات والحسابات</h2>
                    <p>أداة الحاسبة الخاصة بنا تعمل بشكل آلي دون الحاجة لتسجيل حساب أو إدخال أي بيانات شخصية أو حساسة. نحن لا نطلب اسمك أو بريدك الإلكتروني لاستخدام الحاسبة.</p>

                    <h2 class="text-base font-bold text-slate-900 pt-2">2. ملفات تعريف الارتباط (Cookies) وإعلانات Google AdSense</h2>
                    <p>قد يستخدم موقعنا ملفات تعريف الارتباط لتحسين تجربة المستخدم. قد يستخدم موردو الطرف الثالث (بمن فيهم Google) ملفات تعريف الارتباط لعرض الإعلانات بناءً على زيارات المستخدم السابقة لموقعنا أو لمواقع أخرى على شبكة الإنترنت.</p>
                    <ul class="list-disc pr-5 space-y-1 bg-slate-50 p-4 rounded-xl border border-slate-100">
                        <li>تساعد ملفات تعريف الارتباط Google وشركاءها على عرض الإعلانات للمستخدمين بناءً على زيارتهم لموقعنا.</li>
                        <li>يمكن للمستخدمين تعطيل استخدام الإعلانات المخصصة عن طريق زيارة <a href="https://www.google.com/settings/ads" target="_blank" class="text-indigo-600 underline">إعدادات الإعلانات في Google</a>.</li>
                    </ul>

                    <h2 class="text-base font-bold text-slate-900 pt-2">3. ملفات السجل (Log Files)</h2>
                    <p>مثل معظم خوادم المواقع الأخرى، يستخدم PostTime Atlas ملفات السجل لتتبع الزوار (مثل عناوين IP، نوع المتصفح، مزود خدمة الإنترنت، ونوع الجهاز) لغرض تحليل الاتجاهات وإدارة الموقع بشكل آمن.</p>

                    <h2 class="text-base font-bold text-slate-900 pt-2">4. الموافقة والتحديثات</h2>
                    <p>باستخدامك لموقعنا، فإنك توافق على سياسة الخصوصية الخاصة بنا وشروطها. قد نحدث هذه السياسة من وقت لآخر، وسيتم نشر أي تغييرات هنا مباشرة.</p>
                `
            },
            en: {
                docTitle: 'Privacy Policy | PostTime Atlas',
                docDesc: 'Privacy Policy for PostTime Atlas explaining data handling and cookies usage.',
                btnBack: 'Home 🚀',
                pageTitle: 'Privacy Policy',
                pageMeta: 'Updated: 2026',
                footerText: '© 2026 PostTime Atlas. All rights reserved.',
                body: `
                    <p>At <strong>PostTime Atlas</strong>, the privacy of our visitors is of extreme importance to us. This Privacy Policy document outlines the types of personal information received and collected and how it is used.</p>
                    
                    <h2 class="text-base font-bold text-slate-900 pt-2">1. Information Collection</h2>
                    <p>Our interactive time calculator operates without requiring any account registration or personal data entry. We do not collect names, email addresses, or sensitive personal credentials for tool usage.</p>

                    <h2 class="text-base font-bold text-slate-900 pt-2">2. Cookies and Google AdSense</h2>
                    <p>We may use cookies to store information about visitors' preferences. Third-party vendors, including Google, use cookies to serve ads based on a user's prior visits to our website or other websites.</p>
                    <ul class="list-disc pl-5 space-y-1 bg-slate-50 p-4 rounded-xl border border-slate-100">
                        <li>Google's use of advertising cookies enables it and its partners to serve ads based on user visits.</li>
                        <li>Users may opt out of personalized advertising by visiting <a href="https://www.google.com/settings/ads" target="_blank" class="text-indigo-600 underline">Google Ads Settings</a>.</li>
                    </ul>

                    <h2 class="text-base font-bold text-slate-900 pt-2">3. Log Files</h2>
                    <p>Like many other websites, PostTime Atlas makes use of log files (including IP addresses, browser types, ISP, and device characteristics) strictly for aggregate analytical purposes and site management.</p>

                    <h2 class="text-base font-bold text-slate-900 pt-2">4. Consent and Updates</h2>
                    <p>By using our website, you hereby consent to our Privacy Policy and agree to its terms. Any updates to this policy will be posted on this page.</p>
                `
            }
        };

        function renderLanguage() {
            const data = content[currentLang];
            document.getElementById('htmlTag').dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'English 🌐' : 'العربية 🌐';
            document.getElementById('docTitle').innerText = data.docTitle;
            document.getElementById('docDesc').setAttribute('content', data.docDesc);
            document.getElementById('btnBack').innerText = data.btnBack;
            document.getElementById('pageTitle').innerText = data.pageTitle;
            document.getElementById('pageMeta').innerText = data.pageMeta;
            document.getElementById('footerText').innerText = data.footerText;

            const pageBody = document.getElementById('pageBody');
            pageBody.innerHTML = data.body;

            const lists = pageBody.querySelectorAll('ul');
            lists.forEach(ul => {
                if (currentLang === 'ar') {
                    ul.classList.remove('pl-5');
                    ul.classList.add('pr-5');
                } else {
                    ul.classList.remove('pr-5');
                    ul.classList.add('pl-5');
                }
            });
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            renderLanguage();
        }

        window.addEventListener('DOMContentLoaded', renderLanguage);
    </script>
</body>
</html>
