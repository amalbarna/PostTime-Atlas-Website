    <!-- =========================================================
         ANTI-FLICKER / LANGUAGE INITIALIZATION
         Priority:
         1. ?lang=ar / ?lang=en
         2. localStorage siteLang
         3. Browser language
         ========================================================= -->
    <script>
        (function () {
            try {
                var params = new URLSearchParams(window.location.search);
                var urlLang = params.get('lang');

                var savedLang = localStorage.getItem('siteLang');

                var browserLang = (
                    navigator.language ||
                    navigator.userLanguage ||
                    'ar'
                ).toLowerCase();

                var lang;

                // 1. URL language has highest priority
                if (urlLang === 'ar' || urlLang === 'en') {
                    lang = urlLang;
                    localStorage.setItem('siteLang', lang);
                }

                // 2. Previously saved language
                else if (savedLang === 'ar' || savedLang === 'en') {
                    lang = savedLang;
                }

                // 3. Detect browser language
                else {
                    lang = browserLang.startsWith('ar') ? 'ar' : 'en';
                    localStorage.setItem('siteLang', lang);
                }

                var dir = lang === 'ar' ? 'rtl' : 'ltr';

                // Apply immediately before page rendering
                document.documentElement.lang = lang;
                document.documentElement.dir = dir;

                // Make language available to the rest of the page
                window.__initialLang = lang;

            } catch (error) {
                // Safe fallback
                document.documentElement.lang = 'ar';
                document.documentElement.dir = 'rtl';
                window.__initialLang = 'ar';
            }
        })();
    </script>

            }

            // Browser
            const browserLang = (
                navigator.language ||
                navigator.userLanguage ||
                'ar'
            ).toLowerCase();

            const detectedLang = browserLang.startsWith('ar')
                ? 'ar'
                : 'en';

            localStorage.setItem('siteLang', detectedLang);

            return detectedLang;
        }

        /* ========================================================
           CREATE LANGUAGE-AWARE URL
           ======================================================== */

        function getLanguageUrl(url, lang = currentLang) {

            // Ignore empty links
            if (!url) return url;

            // Ignore anchors
            if (url.startsWith('#')) {
                return url;
            }

            // Ignore external URLs
            if (
                url.startsWith('http://') ||
                url.startsWith('https://') ||
                url.startsWith('//') ||
                url.startsWith('mailto:') ||
                url.startsWith('tel:')
            ) {
                return url;
            }

            try {

                const base = window.location.href;

                const parsedUrl = new URL(url, base);

                // Only modify same-origin/local links
                if (parsedUrl.origin !== window.location.origin) {
                    return url;
                }

                // Add/update lang parameter
                parsedUrl.searchParams.set('lang', lang);

                // Keep relative URLs relative
                if (!url.startsWith('/')) {

                    let result =
                        parsedUrl.pathname.split('/').pop();

                    if (!result) {
                        result = '';
                    }

                    const query = parsedUrl.search;
                    const hash = parsedUrl.hash;

                    return result + query + hash;
                }

                return (
                    parsedUrl.pathname +
                    parsedUrl.search +
                    parsedUrl.hash
                );

            } catch (error) {

                return url;
            }
        }


        /* ========================================================
           UPDATE ALL INTERNAL LINKS
           ======================================================== */

        function updateInternalLinks() {

            const links =
                document.querySelectorAll('a[data-internal-link]');

            links.forEach(link => {

                const originalHref =
                    link.getAttribute('href');

                if (!originalHref) return;

                link.setAttribute(
                    'href',
                    getLanguageUrl(originalHref)
                );

            });
        }

        /* ========================================================
           RENDER LANGUAGE
           ======================================================== */

        function renderLanguage() {

            const data =
                translations[currentLang];

            const dir =
                currentLang === 'ar'
                    ? 'rtl'
                    : 'ltr';


            // HTML direction
            document.documentElement.lang =
                currentLang;

            document.documentElement.dir =
                dir;


            // Body direction
            document.getElementById('bodyTag').dir =
                dir;


            // Language button
            document.getElementById('langBtn').innerText =
                currentLang === 'ar'
                    ? 'English 🌐'
                    : 'العربية 🌐';


            // SEO
            document.getElementById('docTitle').innerText =
                data.docTitle;

            document
                .getElementById('docDesc')
                .setAttribute(
                    'content',
                    data.docDesc
                );


            // Page content
            document.getElementById('btnBack').innerText =
                data.btnBack;

            document.getElementById('pageTitle').innerText =
                data.pageTitle;

            document.getElementById('pageSubtitle').innerText =
                data.pageSubtitle;


            // Footer
            document.getElementById('footerText').innerText =
                data.footerText;

            document.getElementById('btnPrivacy').innerText =
                data.btnPrivacy;

            document.getElementById('btnTerms').innerText =
                data.btnTerms;

            document.getElementById('btnContact').innerText =
                data.btnContact;


            // Render cards
            renderArticles();


            // Update every internal link
            updateInternalLinks();
        }


        /* ========================================================
           TOGGLE LANGUAGE
           ======================================================== */

        function toggleLanguage() {

            currentLang =
                currentLang === 'ar'
                    ? 'en'
                    : 'ar';


            // Save preference
            localStorage.setItem(
                'siteLang',
                currentLang
            );


            // Render new language
            renderLanguage();


            // Update current URL without reloading
            const url =
                new URL(window.location.href);

            url.searchParams.set(
                'lang',
                currentLang
            );

            window.history.replaceState(
                {},
                '',
                url.toString()
            );
        }


        /* ========================================================
           INITIAL RENDER
           ======================================================== */

        renderLanguage();


        /* ========================================================
           SAFETY: HANDLE DYNAMICALLY ADDED LINKS
           ======================================================== */

        document.addEventListener(

                const link =

                    );

                if (!link) return;

                const href =
                    link.getAttribute('href');

                if (!href) return;

                link.setAttribute(
                    'href',
                    getLanguageUrl(href)
                );
            }
        );

    </script>
