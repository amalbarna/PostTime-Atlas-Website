<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-578DKRRS7P"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-578DKRRS7P');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Anti-flicker Script & Language/Direction Initialization -->
    <script>
        (function() {
            var urlParams = new URLSearchParams(window.location.search);
            var langParam = urlParams.get('lang');
            var savedLang = langParam || localStorage.getItem('siteLang');
            
            if (!savedLang) {
                var systemLang = (navigator.language || navigator.userLanguage || 'ar').toLowerCase();
                savedLang = systemLang.startsWith('ar') ? 'ar' : 'en';
            }
            
            if (langParam) {
                localStorage.setItem('siteLang', langParam);
            }

            var dir = savedLang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = savedLang;
            document.documentElement.dir = dir;
            window.__initialLang = savedLang;
        })();
    </script>

    <title id="docTitle">المقالات والدلائل | PostTime Atlas</title>
    <meta id="docDesc" name="description" content="اقرأ أحدث المقالات والنصائح حول أوقات النشر المثالية واستراتيجيات نمو المحتوى.">
    
    <!-- SEO Canonical & Hreflang Tags -->
    <link rel="canonical" href="https://amalbarna.github.io/blog.html" id="canonicalUrl">
    <link rel="alternate" hreflang="ar" href="https://amalbarna.github.io/blog.html" />
    <link rel="alternate" hreflang="en" href="https://amalbarna.github.io/blog.html?lang=en" />
    <link rel="alternate" hreflang="x-default" href="https://amalbarna.github.io/blog.html" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', 'Inter', sans-serif; }</style>
</head>
<body id="bodyTag" class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between antialiased">

    <!-- Header -->
    <header class="border-b border-slate-200 p-4 bg-white/90 backdrop-blur sticky top-0 z-40 shadow-sm">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="index.html" id="logoLink" class="flex items-center gap-2.5">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="#4f46e5" stroke-width="2.2"/>
                    <path d="M12 6V12L16 14" stroke="#4f46e5" stroke-width="2.2" stroke-linecap="round"/>
                    <circle cx="12" cy="12" r="2" fill="#4f46e5"/>
                </svg>
                <span class="text-xl font-black text-slate-900 tracking-tight">PostTime<span class="text-indigo-600">Atlas</span></span>
            </a>
            
            <div class="flex items-center gap-3">
                <button onclick="toggleLanguage()" id="langBtn" class="bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700 text-xs px-3 py-1.5 rounded-lg font-bold transition">
                    English 🌐
                </button>
                <a href="index.html" id="btnBack" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-3 py-1.5 rounded-lg font-bold transition">
                    الرئيسية 🚀
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto w-full px-4 my-8 flex-grow space-y-6">
        
        <!-- Header Section -->
        <section class="text-center space-y-3 py-2">
            <h1 id="pageTitle" class="text-3xl md:text-4xl font-extrabold text-slate-900 tracking-tight">
                المقالات والدلائل
            </h1>
            <p id="pageSubtitle" class="text-sm text-slate-600 max-w-xl mx-auto leading-relaxed">
                استكشف أحدث الدلائل والنصائح لتحسين أوقات النشر واستراتيجيات منصات التواصل الاجتماعي.
            </p>
        </section>

        <!-- 5 Category Filters -->
        <div class="flex flex-wrap justify-center gap-2 py-2">
            <button onclick="filterArticles('all')" id="catBtnAll" class="category-btn active px-4 py-1.5 rounded-full text-xs font-bold transition bg-indigo-600 text-white shadow-sm" data-category="all">
                الكل
            </button>
            <button onclick="filterArticles('platforms')" id="catBtnPlatforms" class="category-btn px-4 py-1.5 rounded-full text-xs font-bold transition bg-white border border-slate-200 text-slate-600 hover:border-indigo-600 hover:text-indigo-600" data-category="platforms">
                منصات التواصل
            </button>
            <button onclick="filterArticles('growth')" id="catBtnGrowth" class="category-btn px-4 py-1.5 rounded-full text-xs font-bold transition bg-white border border-slate-200 text-slate-600 hover:border-indigo-600 hover:text-indigo-600" data-category="growth">
                استراتيجيات ونمو
            </button>
            <button onclick="filterArticles('marketing')" id="catBtnMarketing" class="category-btn px-4 py-1.5 rounded-full text-xs font-bold transition bg-white border border-slate-200 text-slate-600 hover:border-indigo-600 hover:text-indigo-600" data-category="marketing">
                التسويق الرقمي
            </button>
            <button onclick="filterArticles('creation')" id="catBtnCreation" class="category-btn px-4 py-1.5 rounded-full text-xs font-bold transition bg-white border border-slate-200 text-slate-600 hover:border-indigo-600 hover:text-indigo-600" data-category="creation">
                صناعة المحتوى
            </button>
        </div>

        <!-- Articles Grid -->
        <div id="articlesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-2">
            <!-- يتم تحميل الكروت تلقائياً بقراءة المقالات المصدرية -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 py-6 text-center text-xs text-slate-500 bg-white mt-12">
        <div class="max-w-4xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <p id="footerText">© 2026 PostTime Atlas. جميع الحقوق محفوظة.</p>
            <div class="flex items-center gap-4 font-semibold text-slate-600">
                <a href="privacy.html" id="btnPrivacy" class="hover:underline hover:text-indigo-600 transition">سياسة الخصوصية</a>
                <a href="terms.html" id="btnTerms" class="hover:underline hover:text-indigo-600 transition">شروط الخدمة</a>
                <a href="contact.html" id="btnContact" class="hover:underline hover:text-indigo-600 transition">اتصل بنا</a>
            </div>
        </div>
    </footer>

    <script>
        function getInitialLanguage() {
            if (window.__initialLang) return window.__initialLang;
            var urlParams = new URLSearchParams(window.location.search);
            var urlLang = urlParams.get('lang');
            var savedLang = localStorage.getItem('siteLang');
            var systemLang = (navigator.language || navigator.userLanguage || 'ar').toLowerCase();
            var lang = urlLang || savedLang || (systemLang.startsWith('ar') ? 'ar' : 'en');
            localStorage.setItem('siteLang', lang);
            return lang;
        }

        let currentLang = getInitialLanguage();
        let activeCategory = 'all';

        // دالة توليد مسارات المقالات تلقائياً والبحث في المقالات المتاحة
        async function getAvailableArticleFiles() {
            const files = [];
            const MAX_ARTICLES_CHECK = 50; // يمكنك رفع رقم أقصى للمقالات هنا
            
            const checks = [];
            for (let i = 1; i <= MAX_ARTICLES_CHECK; i++) {
                const path = `articles/article-${i}.html`;
                checks.push(
                    fetch(path, { method: 'HEAD' })
                        .then(res => res.ok ? path : null)
                        .catch(() => null)
                );
            }
            const results = await Promise.all(checks);
            return results.filter(path => path !== null);
        }

        const translations = {
            ar: {
                docTitle: 'المقالات والدلائل | PostTime Atlas',
                docDesc: 'اقرأ أحدث المقالات والنصائح حول أوقات النشر المثالية واستراتيجيات نمو المحتوى.',
                btnBack: 'الرئيسية 🚀',
                pageTitle: 'المقالات والدلائل',
                pageSubtitle: 'استكشف أحدث الدلائل والنصائح لتحسين أوقات النشر واستراتيجيات منصات التواصل الاجتماعي.',
                catAll: 'الكل',
                catPlatforms: 'منصات التواصل',
                catGrowth: 'استراتيجيات ونمو',
                catMarketing: 'التسويق الرقمي',
                catCreation: 'صناعة المحتوى',
                readMore: 'اقرأ المقال الكامل',
                loading: 'جاري تحميل المقالات...',
                footerText: '© 2026 PostTime Atlas. جميع الحقوق محفوظة.',
                btnPrivacy: 'سياسة الخصوصية',
                btnTerms: 'شروط الخدمة',
                btnContact: 'اتصل بنا'
            },
            en: {
                docTitle: 'Articles & Guides | PostTime Atlas',
                docDesc: 'Read the latest articles and tips on optimal social media posting times.',
                btnBack: 'Home 🚀',
                pageTitle: 'Articles & Guides',
                pageSubtitle: 'Explore the latest guides and tips to optimize posting times and social media strategies.',
                catAll: 'All',
                catPlatforms: 'Social Platforms',
                catGrowth: 'Strategies & Growth',
                catMarketing: 'Digital Marketing',
                catCreation: 'Content Creation',
                readMore: 'Read Full Article',
                loading: 'Loading articles...',
                footerText: '© 2026 PostTime Atlas. All rights reserved.',
                btnPrivacy: 'Privacy Policy',
                btnTerms: 'Terms of Service',
                btnContact: 'Contact Us'
            }
        };

        // دالة جلب بيانات كل مقال تلقائياً وقراءة تصنيفه
        async function fetchArticleData(filePath) {
            try {
                const response = await fetch(filePath);
                if (!response.ok) return null;
                const htmlText = await response.text();
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');

                const imgElement = doc.getElementById('articleImg');
                const imgSrc = imgElement ? imgElement.getAttribute('src') : 'https://picsum.photos/id/1070/1200/600';

                const scripts = doc.querySelectorAll('script');
                let articleContent = null;

                scripts.forEach(script => {
                    if (script.textContent.includes('const content =')) {
                        const match = script.textContent.match(/const content = ({[\s\S]*?});/);
                        if (match && match[1]) {
                            try {
                                articleContent = eval('(' + match[1] + ')');
                            } catch (e) {
                                console.error('Error parsing content from script:', e);
                            }
                        }
                    }
                });

                if (articleContent) {
                    return {
                        id: filePath,
                        category: articleContent.category || 'platforms', 
                        image: imgSrc,
                        title: {
                            ar: articleContent.ar?.articleTitle || '',
                            en: articleContent.en?.articleTitle || ''
                        },
                        excerpt: {
                            ar: articleContent.ar?.docDesc || '',
                            en: articleContent.en?.docDesc || ''
                        },
                        readTime: {
                            ar: articleContent.ar?.articleMeta ? articleContent.ar.articleMeta.split('|')[1] || '5 دقائق قراءة' : '5 دقائق قراءة',
                            en: articleContent.en?.articleMeta ? articleContent.en.articleMeta.split('|')[1] || '5 min read' : '5 min read'
                        }
                    };
                }
            } catch (error) {
                console.error(`Error loading article file ${filePath}:`, error);
            }
            return null;
        }

        // دالة تصفية المقالات
        function filterArticles(category) {
            activeCategory = category;
            const buttons = document.querySelectorAll('.category-btn');
            
            buttons.forEach(btn => {
                if (btn.getAttribute('data-category') === category) {
                    btn.className = 'category-btn active px-4 py-1.5 rounded-full text-xs font-bold transition bg-indigo-600 text-white shadow-sm';
                } else {
                    btn.className = 'category-btn px-4 py-1.5 rounded-full text-xs font-bold transition bg-white border border-slate-200 text-slate-600 hover:border-indigo-600 hover:text-indigo-600';
                }
            });

            const cards = document.querySelectorAll('#articlesGrid article');
            cards.forEach(card => {
                const cardCat = card.getAttribute('data-category');
                if (category === 'all' || cardCat === category) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // عرض المقالات ديناميكياً
        async function renderArticles() {
            const grid = document.getElementById('articlesGrid');
            grid.innerHTML = `<p class="text-center col-span-1 md:col-span-2 text-slate-400 text-xs py-8">${translations[currentLang].loading}</p>`;

            const availableFiles = await getAvailableArticleFiles();
            const fetchedArticles = await Promise.all(availableFiles.map(file => fetchArticleData(file)));
            const validArticles = fetchedArticles.filter(art => art !== null).reverse(); // عرض الأحدث أولاً

            grid.innerHTML = '';
            const arrowIcon = currentLang === 'ar' ? '←' : '→';

            validArticles.forEach(art => {
                const articleUrl = `${art.id}?lang=${currentLang}`;
                const card = document.createElement('article');
                
                card.setAttribute('data-category', art.category);
                card.className = 'bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between';
                
                card.innerHTML = `
                    <div>
                        <a href="${articleUrl}" class="block aspect-video overflow-hidden bg-slate-100">
                            <img src="${art.image}" alt="${art.title[currentLang]}" class="w-full h-full object-cover hover:scale-105 transition duration-500" loading="lazy" />
                        </a>
                        <div class="p-5 space-y-3">
                            <div class="flex justify-between items-center text-xs text-slate-400 font-semibold">
                                <span>PostTime Atlas</span>
                                <span>${art.readTime[currentLang]}</span>
                            </div>
                            <h2 class="text-base md:text-lg font-bold text-slate-900 leading-snug">
                                <a href="${articleUrl}" class="hover:text-indigo-600 transition">
                                    ${art.title[currentLang]}
                                </a>
                            </h2>
                            <p class="text-xs text-slate-600 leading-relaxed">
                                ${art.excerpt[currentLang]}
                            </p>
                        </div>
                    </div>
                    <div class="px-5 pb-5 pt-2">
                        <a href="${articleUrl}" class="text-xs font-bold text-indigo-600 hover:text-indigo-800 transition inline-flex items-center gap-1">
                            ${translations[currentLang].readMore} ${arrowIcon}
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });

            filterArticles(activeCategory);
        }

        function renderLanguage() {
            const data = translations[currentLang];
            const dir = currentLang === 'ar' ? 'rtl' : 'ltr';

            document.documentElement.lang = currentLang;
            document.documentElement.dir = dir;
            document.getElementById('htmlTag').dir = dir;
            document.getElementById('bodyTag').dir = dir;

            document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'English 🌐' : 'العربية 🌐';
            document.getElementById('docTitle').innerText = data.docTitle;
            document.getElementById('docDesc').setAttribute('content', data.docDesc);

            document.getElementById('logoLink').href = `index.html?lang=${currentLang}`;
            document.getElementById('btnBack').innerText = data.btnBack;
            document.getElementById('btnBack').href = `index.html?lang=${currentLang}`;

            document.getElementById('pageTitle').innerText = data.pageTitle;
            document.getElementById('pageSubtitle').innerText = data.pageSubtitle;

            document.getElementById('catBtnAll').innerText = data.catAll;
            document.getElementById('catBtnPlatforms').innerText = data.catPlatforms;
            document.getElementById('catBtnGrowth').innerText = data.catGrowth;
            document.getElementById('catBtnMarketing').innerText = data.catMarketing;
            document.getElementById('catBtnCreation').innerText = data.catCreation;

            document.getElementById('footerText').innerText = data.footerText;
            document.getElementById('btnPrivacy').innerText = data.btnPrivacy;
            document.getElementById('btnPrivacy').href = `privacy.html?lang=${currentLang}`;

            document.getElementById('btnTerms').innerText = data.btnTerms;
            document.getElementById('btnTerms').href = `terms.html?lang=${currentLang}`;

            document.getElementById('btnContact').innerText = data.btnContact;
            document.getElementById('btnContact').href = `contact.html?lang=${currentLang}`;

            renderArticles();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            localStorage.setItem('siteLang', currentLang);

            const newUrl = new URL(window.location);
            newUrl.searchParams.set('lang', currentLang);
            window.history.pushState({}, '', newUrl);

            renderLanguage();
        }

        renderLanguage();
    </script>
</body>
</html>
