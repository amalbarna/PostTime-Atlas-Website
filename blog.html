<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Anti-flicker Script & Language/Direction Initialization -->
    <script>
        (function() {
            // 1. فحص معلمة اللغة في الـ URL أولاً (مثال: ?lang=en)
            var urlParams = new URLSearchParams(window.location.search);
            var urlLang = urlParams.get('lang');
            
            // 2. قراءة اللغة المحفوظة في localStorage
            var savedLang = localStorage.getItem('siteLang');
            
            // 3. قراءة لغة المتصفح النظامية
            var systemLang = (navigator.language || navigator.userLanguage || 'ar').toLowerCase();
            var detectedBrowserLang = systemLang.startsWith('ar') ? 'ar' : 'en';
            
            // تحديد اللغة النهائية حسب الأولوية: URL -> localStorage -> لغة المتصفح
            var lang = urlLang || savedLang || detectedBrowserLang;
            
            // ضمان حفظ تفضيل المستخدم في localStorage دائماً
            localStorage.setItem('siteLang', lang);
            
            var dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;
            document.documentElement.dir = dir;
            window.__initialLang = lang;
        })();
    </script>

    <title id="docTitle">المقالات والدلائل | PostTime Atlas</title>
    <meta id="docDesc" name="description" content="اقرأ أحدث المقالات والنصائح حول أوقات النشر المثالية واستراتيجيات نمو المحتوى.">
    
    <!-- SEO Canonical & Hreflang Tags -->
    <link rel="canonical" href="https://amalbarna.github.io/blog.html" id="canonicalUrl">
    <link rel="alternate" hreflang="ar" href="https://amalbarna.github.io/blog.html" />
    <link rel="alternate" hreflang="en" href="https://amalbarna.github.io/blog.html?lang=en" />
    <link rel="alternate" hreflang="x-default" href="https://amalbarna.github.io/blog.html" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', 'Inter', sans-serif; }</style>
</head>
<body id="bodyTag" class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between antialiased">

    <!-- Header -->
    <header class="border-b border-slate-200 p-4 bg-white/90 backdrop-blur sticky top-0 z-40 shadow-sm">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2.5">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="#4f46e5" stroke-width="2.2"/>
                    <path d="M12 6V12L16 14" stroke="#4f46e5" stroke-width="2.2" stroke-linecap="round"/>
                    <circle cx="12" cy="12" r="2" fill="#4f46e5"/>
                </svg>
                <span class="text-xl font-black text-slate-900 tracking-tight">PostTime<span class="text-indigo-600">Atlas</span></span>
            </a>
            
            <div class="flex items-center gap-3">
                <button onclick="toggleLanguage()" id="langBtn" class="bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700 text-xs px-3 py-1.5 rounded-lg font-bold transition">
                    English 🌐
                </button>
                <a href="index.html" id="btnBack" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-3 py-1.5 rounded-lg font-bold transition">
                    الرئيسية 🚀
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto w-full px-4 my-8 flex-grow space-y-8">
        
        <!-- Header Section -->
        <section class="text-center space-y-3 py-4">
            <h1 id="pageTitle" class="text-3xl md:text-4xl font-extrabold text-slate-900 tracking-tight">
                المقالات والدلائل
            </h1>
            <p id="pageSubtitle" class="text-sm text-slate-600 max-w-xl mx-auto leading-relaxed">
                استكشف أحدث الدلائل والنصائح لتحسين أوقات النشر واستراتيجيات منصات التواصل الاجتماعي.
            </p>
        </section>

        <!-- Articles Grid -->
        <div id="articlesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- سيتم توليد الكروت بالصور والمحتوى المحدث عبر JavaScript -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 py-6 text-center text-xs text-slate-500 bg-white mt-12">
        <div class="max-w-4xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <p id="footerText">© 2026 PostTime Atlas. جميع الحقوق محفوظة.</p>
            <div class="flex items-center gap-4 font-semibold text-slate-600">
                <a href="privacy.html" id="btnPrivacy" class="hover:underline hover:text-indigo-600 transition">سياسة الخصوصية</a>
                <a href="terms.html" id="btnTerms" class="hover:underline hover:text-indigo-600 transition">شروط الخدمة</a>
                <a href="contact.html" id="btnContact" class="hover:underline hover:text-indigo-600 transition">اتصل بنا</a>
            </div>
        </div>
    </footer>

    <script>
        function getInitialLanguage() {
            if (window.__initialLang) return window.__initialLang;
            
            const urlParams = new URLSearchParams(window.location.search);
            const urlLang = urlParams.get('lang');
            const savedLang = localStorage.getItem('siteLang');
            const systemLang = (navigator.language || navigator.userLanguage || 'ar').toLowerCase();
            
            const lang = urlLang || savedLang || (systemLang.startsWith('ar') ? 'ar' : 'en');
            localStorage.setItem('siteLang', lang);
            return lang;
        }

        let currentLang = getInitialLanguage();

        // بيانات المقالات مع استخدام الصور الفعلية والبارزة لكل مقال
        const articles = [
            {
                id: 'articles/article-1.html',
                image: 'https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?auto=format&fit=crop&w=1200&q=80',
                title: { 
                    ar: 'استراتيجيات اختيار أوقات النشر على إنستغرام وتيك توك', 
                    en: 'Strategies for Choosing Posting Times on Instagram and TikTok' 
                },
                excerpt: { 
                    ar: 'دليل عملي لتحديد أفضل الساعات والأيام لنشر محتواك على إنستغرام وتيك توك لزيادة الوصول والتفاعل.', 
                    en: 'A practical guide to determining the best hours and days to post on Instagram and TikTok for maximum reach.' 
                },
                readTime: { ar: '3 دقائق قراءة', en: '3 min read' }
            },
            {
                id: 'articles/article-2.html',
                image: 'https://images.unsplash.com/photo-1508873696983-2df515122519?auto=format&fit=crop&w=1200&q=80',
                title: { 
                    ar: 'كيف تؤثر المناطق الزمنية (Timezones) على وصول المحتوى؟', 
                    en: 'How Do Timezones Impact Your Content Reach?' 
                },
                excerpt: { 
                    ar: 'فهم اختلاف التوقيت بين الدول وكيفية جدولة المنشورات لتستهدف جمهورك في أوقات ذروة نشاطهم.', 
                    en: 'Understand time zone differences and learn how to schedule posts to target your audience at peak activity hours.' 
                },
                readTime: { ar: '5 دقائق قراءة', en: '5 min read' }
            },
            {
                id: 'articles/article-3.html',
                image: 'https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1200&q=80',
                title: { 
                    ar: 'كيف تقيس نجاح أوقات النشر؟ تحليل البيانات والمقاييس الرئيسية', 
                    en: 'How to Measure Posting Time Success: Data Analysis & Key Metrics' 
                },
                excerpt: { 
                    ar: 'المقاييس المهمة لتقييم أداء جدول نشرك وكيفية استخدام التحليلات لتعديل وتحسين استراتيجيتك باستمرار.', 
                    en: 'Key metrics for evaluating your posting schedule performance and using analytics to continuously refine your strategy.' 
                },
                readTime: { ar: '5 دقائق قراءة', en: '5 min read' }
            },
            {
                id: 'articles/article-4.html',
                image: 'https://images.unsplash.com/photo-1506784983877-45594efa4cbe?auto=format&fit=crop&w=1200&q=80',
                title: { 
                    ar: 'تنسيق أنواع المحتوى مع جدول النشر: الاستراتيجية والتكرار', 
                    en: 'Aligning Content Types with Your Schedule: Strategy and Frequency' 
                },
                excerpt: { 
                    ar: 'طريقة اختيار الوقت المناسب لنشر الصور، المقاطع القصيرة، والمقالات، وتحديد تكرار النشر المثالي.', 
                    en: 'How to choose optimal times for photos, short-form videos, and text, while finding the ideal posting frequency.' 
                },
                readTime: { ar: '5 دقائق قراءة', en: '5 min read' }
            },
            {
                id: 'articles/article-5.html',
                image: 'https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=1200&q=80',
                title: { 
                    ar: 'أوقات الذروة: لحسابات الشركات (B2B) مقابل التجارة الإلكترونية (B2C)', 
                    en: 'Peak Times: B2B Business Accounts vs. B2C E-Commerce' 
                },
                excerpt: { 
                    ar: 'اختلاف أوقات استجابة الجمهور بين قطاع الأعمال والمستهلكين وكيف تبني جدول نشر مناسب لنوع نشاطك.', 
                    en: 'Discover how audience response times vary between B2B and B2C, and build a posting schedule tailored to your business.' 
                },
                readTime: { ar: '4 دقائق قراءة', en: '4 min read' }
            }
        ];

        const translations = {
            ar: {
                docTitle: 'المقالات والدلائل | PostTime Atlas',
                docDesc: 'اقرأ أحدث المقالات والنصائح حول أوقات النشر المثالية واستراتيجيات نمو المحتوى.',
                btnBack: 'الرئيسية 🚀',
                pageTitle: 'المقالات والدلائل',
                pageSubtitle: 'استكشف أحدث الدلائل والنصائح لتحسين أوقات النشر واستراتيجيات منصات التواصل الاجتماعي.',
                readMore: 'اقرأ المقال الكامل',
                footerText: '© 2026 PostTime Atlas. جميع الحقوق محفوظة.',
                btnPrivacy: 'سياسة الخصوصية',
                btnTerms: 'شروط الخدمة',
                btnContact: 'اتصل بنا'
            },
            en: {
                docTitle: 'Articles & Guides | PostTime Atlas',
                docDesc: 'Read the latest articles and tips on optimal social media posting times.',
                btnBack: 'Home 🚀',
                pageTitle: 'Articles & Guides',
                pageSubtitle: 'Explore the latest guides and tips to optimize posting times and social media strategies.',
                readMore: 'Read Full Article',
                footerText: '© 2026 PostTime Atlas. All rights reserved.',
                btnPrivacy: 'Privacy Policy',
                btnTerms: 'Terms of Service',
                btnContact: 'Contact Us'
            }
        };

        function renderArticles() {
            const grid = document.getElementById('articlesGrid');
            grid.innerHTML = '';

            const arrowIcon = currentLang === 'ar' ? '←' : '→';

            articles.forEach(art => {
                const card = document.createElement('article');
                card.className = 'bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between';
                
                // إضافة معلمة اللغة للرابط لضمان بقاء المستخدم على نفس تفضيل اللغة عند الضغط
                const articleUrl = `${art.id}?lang=${currentLang}`;

                card.innerHTML = `
                    <div>
                        <a href="${articleUrl}" class="block aspect-video overflow-hidden bg-slate-100">
                            <img src="${art.image}" alt="${art.title[currentLang]}" class="w-full h-full object-cover hover:scale-105 transition duration-500" loading="eager" />
                        </a>
                        <div class="p-5 space-y-3">
                            <div class="flex justify-between items-center text-xs text-slate-400 font-semibold">
                                <span>PostTime Atlas</span>
                                <span>${art.readTime[currentLang]}</span>
                            </div>
                            <h2 class="text-base md:text-lg font-bold text-slate-900 leading-snug">
                                <a href="${articleUrl}" class="hover:text-indigo-600 transition">
                                    ${art.title[currentLang]}
                                </a>
                            </h2>
                            <p class="text-xs text-slate-600 leading-relaxed">
                                ${art.excerpt[currentLang]}
                            </p>
                        </div>
                    </div>
                    <div class="px-5 pb-5 pt-2">
                        <a href="${articleUrl}" class="text-xs font-bold text-indigo-600 hover:text-indigo-800 transition inline-flex items-center gap-1">
                            ${translations[currentLang].readMore} ${arrowIcon}
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderLanguage() {
            const data = translations[currentLang];
            const dir = currentLang === 'ar' ? 'rtl' : 'ltr';

            document.documentElement.lang = currentLang;
            document.documentElement.dir = dir;
            document.getElementById('htmlTag').dir = dir;
            document.getElementById('bodyTag').dir = dir;

            document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'English 🌐' : 'العربية 🌐';
            document.getElementById('docTitle').innerText = data.docTitle;
            document.getElementById('docDesc').setAttribute('content', data.docDesc);
            
            // تحديث رابط زر الرئيسية ليشمل معلمة اللغة
            document.getElementById('btnBack').innerText = data.btnBack;
            document.getElementById('btnBack').setAttribute('href', `index.html?lang=${currentLang}`);

            document.getElementById('pageTitle').innerText = data.pageTitle;
            document.getElementById('pageSubtitle').innerText = data.pageSubtitle;

            document.getElementById('footerText').innerText = data.footerText;
            
            // تحديث روابط أسفل الصفحة مع حفظ مفتاح اللغة
            document.getElementById('btnPrivacy').innerText = data.btnPrivacy;
            document.getElementById('btnPrivacy').setAttribute('href', `privacy.html?lang=${currentLang}`);
            
            document.getElementById('btnTerms').innerText = data.btnTerms;
            document.getElementById('btnTerms').setAttribute('href', `terms.html?lang=${currentLang}`);
            
            document.getElementById('btnContact').innerText = data.btnContact;
            document.getElementById('btnContact').setAttribute('href', `contact.html?lang=${currentLang}`);

            renderArticles();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            localStorage.setItem('siteLang', currentLang);
            
            // تحديث رابط الـ URL بدون إعادة تحميل الصفحة
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('lang', currentLang);
            window.history.pushState({}, '', newUrl);

            renderLanguage();
        }

        renderLanguage();
    </script>
</body>
</html>
